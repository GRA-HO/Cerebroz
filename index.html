<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Zopa de Zerebroz - La Casa de Dave</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root { --zombie-green: #4f7942; --brain-pink: #ff8fb1; --dirt-brown: #3d2b1f; --gold: #ffd700; }
        
        body { 
            margin: 0; background: #0a0a0a url('https://www.transparenttextures.com/patterns/dark-matter.png');
            font-family: 'Special Elite', cursive; color: #fff;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        
        .header-box { 
            text-align: center; background: url('https://img.freepik.com/foto-gratis/textura-papel-viejo-marron-manchado-fondo-vintage-aislado_1101-2857.jpg');
            background-size: cover; padding: 20px; border: 5px solid var(--dirt-brown);
            box-shadow: 0 0 20px rgba(0,0,0,0.8); transform: rotate(-1deg); width: 95%; max-width: 800px; color: #000;
        }

        h1 { font-family: 'Creepster', cursive; color: var(--zombie-green); font-size: 2.5em; margin: 0; text-shadow: 2px 2px 0px #000; }
        
        .main-sel-box { width: 95%; max-width: 800px; background: #1a1a1a; border: 2px dashed var(--zombie-green); border-radius: 8px; padding: 20px; margin-top: 25px; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input.mago-input {
            flex: 1; min-width: 200px; padding: 12px; border-radius: 6px; 
            border: 2px solid var(--zombie-green); background: #000; color: var(--brain-pink); font-size: 16px; font-family: 'Special Elite';
        }

        #cantidad { width: 100%; background: transparent; border: none; color: var(--gold); font-size: 18px; outline: none; cursor: pointer; border-top: 1px solid #333; padding-top: 10px; font-family: 'Permanent Marker'; }
        
        .gragea-card { width: 90%; max-width: 450px; background: rgba(30, 30, 30, 0.9); border: 2px solid var(--brain-pink); border-radius: 12px; padding: 20px; margin: 15px 0; position: relative; }
        .gragea-card::after { content: '🧠'; position: absolute; top: -10px; right: -10px; font-size: 24px; }

        .label-cerebro { font-size: 12px; color: var(--brain-pink); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; font-weight: bold; }
        .sabor-sel { width: 100%; padding: 10px; background: #000; border: 1px solid var(--zombie-green); border-radius: 6px; color: #fff; margin-bottom: 10px; font-family: 'Special Elite'; }
        
        .btn-abrir { 
            background: var(--zombie-green); color: #fff; border: none; padding: 18px 60px; border-radius: 10px; 
            font-family: 'Creepster', cursive; font-size: 24px; cursor: pointer; display: none; margin: 30px 0; transition: 0.3s; 
        }
        .btn-abrir:hover { background: var(--brain-pink); color: #000; transform: scale(1.05) rotate(2deg); }

        .historial-box { width: 95%; max-width: 650px; background: rgba(0,0,0,0.95); border: 2px solid var(--dirt-brown); border-radius: 12px; padding: 20px; }
        .historial-entrada { position: relative; background: rgba(79, 121, 66, 0.1); border-left: 5px solid var(--zombie-green); padding: 15px; margin-bottom: 15px; border-radius: 8px; white-space: pre-wrap; font-size: 14px; color: #e0e0e0; }
        
        .btn-copiar {
            position: absolute; top: 10px; right: 10px; background: var(--dirt-brown); color: #fff;
            border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-family: 'Permanent Marker';
        }

        .footer { font-family: 'Creepster'; color: var(--zombie-green); font-size: 28px; margin: 40px 0; }
    </style>
</head>
<body>
    <div class="header-box">
        <h1>ೃ⁀➷ LA TIENDA DE CRAZY DAVE 🧟</h1>
        <p style="font-family:'Permanent Marker'; margin:5px 0;">"Wabi-wabbo! Elige tu rrazion de zerebroz freskoz."</p>
    </div>
    
    <div class="main-sel-box">
        <div class="input-group">
            <input type="text" id="nombre-trabajador" class="mago-input" placeholder="Zonbi que atiende...">
            <input type="text" id="nombre-cliente" class="mago-input" placeholder="Víctima (Cliente)...">
        </div>
        <select id="cantidad" onchange="generarCajas()">
            <option value="0">¿QUÉ VAS A COMPRAR? --</option>
            <option value="1">🧠 Zerebro Suelto (1 zorpreza) - 5.000G</option>
            <option value="6">🧪 Plato de Media Zopa (6 zorprezas) - 45.000G</option>
            <option value="12">🥣 Sopa de Zerebroz XL (12 zorprezas) - 100.000G</option>
        </select>
    </div>

    <div id="contenedor-grageas"></div>
    <button id="btn-magico" class="btn-abrir" onclick="abrirGrageas()">¡MORDIZCO FINAL! 🧠🍴</button>

    <div id="historial-seccion" class="historial-box">
        <h2 style="color:var(--zombie-green); font-family:'Creepster'; text-align:center; margin-top:0;">📜 REGIZTRO DE ZEREBROZ</h2>
        <div id="log-content">Buzcando zerebroz...</div>
    </div>

    <div class="footer">LA CASA DE DAVE - H.O.</div>

    <script>
        const DB_URL = "https://hogwarts-orion-default-rtdb.firebaseio.com/historial_zombie.json";

        const SABORES = ["Jeremias Snape", "Justina Black", "Andra Scamander", "Laura Lovegood Maggi", "Malena Nott de Scamander", "Leslie Rowan Scamander de Nott", "Sofi Hofferson Hopps", "Cris DelaCour", "Uriel Scamander Black", "Fernando Greengrass", "Melina Malfoy Weasley", "Luis Weasley Malfoy", "Odettesalia Dalila Grindelwald Salvatote", "Aix Lovegood Black", "Vania Hazel Malfoy", "Belu Amelia Black Scamander", "Tomas Goldstein", "Martina Denise Sayre Black", "Gabriel Eduardo Sayre Black", "Nancy Prue Romero Halliwel", "Fran Zabini Woodcroft", "Diego Lars Goldstein", "Nick Elodeon Moretti Scamander", "Aude Volant", "Nina Isabella Zabini Grindelwald", "Rabbit Black Potter", "Milagros Malfoy Potter", "Alii Evans", "Gabriel Percival Nott Grindelwald", "Sheena Black", "Molly Black Potter", "Matt Nightflame", "Belu Malfoy", "Leonor Wood", "Bets Peverell", "Isaac Sak", "Darianny Black Scamander", "Milch Greengrass Lovegood", "Isidora Riddle", "Axel Flavor", "Amra Rosier", "Angélica Snape Lestrange", "Camila Nott", "Raphael Black", "Alicia Lissette Grindelwald Lestrange", "Elizabeth Malfoy", "Gisela Silverthorne", "Estela Malfoy", "Meisy Dawnstrider", "Xavyera Black", "Benja Scamander Black", "Jose Black", "Giovanna Prince", "Juan Blackjack", "Alexis Black", "Alexander Potter", "Mar Selwyn", "Fer Riddell", "Wendy Black", "Katt Riddle", "Yue Ming", "Angel Rosier", "Jimmy Baltazar Jinwoo Cheonsang Sung", "Linda Yudith Nott"];

        function cargarHistorialGlobal() {
            fetch(DB_URL).then(res => res.json()).then(data => {
                const log = document.getElementById('log-content');
                if(!data) { log.innerHTML = "No hay zerebroz registrados."; return; }
                let html = "";
                const entradas = Object.values(data).reverse();
                entradas.forEach(e => html += e);
                log.innerHTML = html;
            });
        }

        setInterval(cargarHistorialGlobal, 5000);
        window.onload = cargarHistorialGlobal;

        function generarCajas() {
            const num = parseInt(document.getElementById('cantidad').value);
            const container = document.getElementById('contenedor-grageas');
            container.innerHTML = "";
            if (num > 0) {
                document.getElementById('btn-magico').style.display = "inline-block";
                let opts = `<option value="Aleatorio">Cerebro Aleatorio 🎲</option>`;
                SABORES.forEach(s => opts += `<option value="${s}">Cerebro de ${s}</option>`);
                
                for (let i = 1; i <= num; i++) {
                    const card = document.createElement('div');
                    card.className = 'gragea-card';
                    card.innerHTML = `<span style="color:var(--brain-pink); font-weight:bold; font-size:18px;">PIEZA ${i} 🧠</span><br><br>` + 
                                     `<span class="label-cerebro">Morder cerebro de:</span><select class="sabor-sel sabor-box-${i}">${opts}</select>`;
                    container.appendChild(card);
                }
            }
        }

        function generarResultadoTramposo() {
            const esMalo = Math.random() < 0.70;
            const cantidad = Math.floor(Math.random() * (30000 - 1000 + 1)) + 1000;
            const solesGaleones = Math.random() < 0.4 ? "Puntos 🧠" : "Soles (Galeones) ☀️";

            if(esMalo) {
                return `-${cantidad.toLocaleString()} ${solesGaleones} (¡Podrido! 🤮)`;
            } else {
                return `+${cantidad.toLocaleString()} ${solesGaleones} (¡Zabrozo! 🌻)`;
            }
        }

        function abrirGrageas() {
            const trabajador = document.getElementById('nombre-trabajador').value || "Zonbi Dave";
            const cliente = document.getElementById('nombre-cliente').value || "Víctima";
            const num = parseInt(document.getElementById('cantidad').value);
            
            let textoCopiable = `⋆ ————————✧◦🧟◦✧———————— ⋆\n\n`;
            let titulo = num === 12 ? "ꜱᴏᴘᴀ ᴅᴇ ᴢᴇʀᴇʙʀᴏᴢ ᴘʀᴇᴍɪᴜᴍ 🥣" : (num === 6 ? "ᴍᴇᴅɪᴀ ᴢᴏᴘᴀ ᴅᴇ ᴢᴇʀᴇʙʀᴏᴢ 🧪" : "ᴢᴇʀᴇʙʀᴏ ᴢᴜᴇʟᴛᴏ 🧠");
            textoCopiable += `╰┈➤ ${titulo}\n\n`;

            for (let i = 1; i <= num; i++) {
                const select = document.querySelector(`.sabor-box-${i}`);
                let sabor = select.value;
                if (sabor === "Aleatorio") {
                    sabor = SABORES[Math.floor(Math.random() * SABORES.length)];
                }
                const premio = generarResultadoTramposo();
                textoCopiable += `Pieza ${i}: Masticando cerebro de ${sabor} ⟶ ${premio}\n`;
            }

            textoCopiable += `\n⋆ ————————✧◦🧟◦✧———————— ⋆\n`;
            textoCopiable += `@${cliente} | Atendido por: ${trabajador}`;

            const id = Date.now();
            const entradaHtml = `
                <div class="historial-entrada" id="entry-${id}">
                    <button class="btn-copiar" onclick="copiarTexto('${id}')">COPIAR 📋</button>
                    <div id="text-${id}">${textoCopiable}</div>
                </div>`;

            fetch(DB_URL, {
                method: 'POST',
                body: JSON.stringify(entradaHtml)
            }).then(() => {
                generarCajas();
                cargarHistorialGlobal();
            });
        }

        function copiarTexto(id) {
            const texto = document.getElementById(`text-${id}`).innerText;
            navigator.clipboard.writeText(texto).then(() => {
                const btn = document.querySelector(`#entry-${id} .btn-copiar`);
                btn.innerText = "¡COPIADO! 🧟";
                setTimeout(() => btn.innerText = "COPIAR 📋", 2000);
            });
        }
    </script>
</body>
</html>
